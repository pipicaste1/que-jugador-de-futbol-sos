<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Jugador de Fútbol - Test</title>
<style>
  :root{
    --pitch-dark:#0B3D2E;
    --pitch-darker:#082A20;
    --paper:#EFE7D6;
    --gold:#D4AF37;
    --gold-light:#F0D77B;
    --red:#E63946;
    --ink:#16211C;
    --navy:#0D1B2A;
    --line:rgba(239,231,214,0.18);

    --card-bg:#101317;
    --card-bg-2:#181D22;
    --card-edge:#2A3138;
    --emerald:#1FBF80;
    --emerald-light:#5FE3AD;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{
    height:100%;
    font-family:'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
    background:
      radial-gradient(circle at 15% -10%, rgba(212,175,55,0.16), transparent 45%),
      radial-gradient(circle at 90% 0%, rgba(212,175,55,0.10), transparent 40%),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 90px),
      linear-gradient(180deg, var(--pitch-dark), var(--pitch-darker));
    color:var(--paper);
    min-height:100vh;
    overflow-x:hidden;
  }

  .scoreboard-font{
    font-family:'Courier New', Courier, monospace;
    letter-spacing:2px;
  }

  #app{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
  }

  .wrap{
    width:100%;
    max-width:480px;
  }

  /* ---------- START SCREEN ---------- */
  .start-screen{
    text-align:center;
    padding:10px 4px;
  }

  .kicker{
    display:inline-block;
    font-family:'Courier New', monospace;
    letter-spacing:4px;
    font-size:12px;
    color:var(--gold-light);
    border:1px solid var(--line);
    border-radius:999px;
    padding:6px 16px;
    margin-bottom:26px;
    background:rgba(212,175,55,0.08);
  }

  .ball-line{
    font-size:34px;
    margin-bottom:10px;
    letter-spacing:6px;
  }

  h1.title{
    font-family:'Arial Black', Impact, 'Segoe UI', sans-serif;
    font-size:38px;
    line-height:1.08;
    text-transform:uppercase;
    letter-spacing:1px;
    margin-bottom:14px;
    text-shadow:0 2px 0 rgba(0,0,0,0.35);
  }

  .title .accent{
    color:var(--gold);
  }

  .subtitle{
    font-size:15px;
    color:rgba(239,231,214,0.75);
    max-width:340px;
    margin:0 auto 34px auto;
    line-height:1.5;
  }

  .btn{
    appearance:none;
    border:none;
    cursor:pointer;
    font-family:'Arial Black', Impact, 'Segoe UI', sans-serif;
    text-transform:uppercase;
    letter-spacing:2px;
    font-size:16px;
    padding:16px 40px;
    border-radius:10px;
    background:linear-gradient(180deg, var(--gold-light), var(--gold));
    color:var(--navy);
    box-shadow:0 6px 0 #8a6d1f, 0 10px 18px rgba(0,0,0,0.35);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:active{
    transform:translateY(4px);
    box-shadow:0 2px 0 #8a6d1f, 0 6px 10px rgba(0,0,0,0.3);
  }

  .start-footnote{
    margin-top:22px;
    font-size:11px;
    color:rgba(239,231,214,0.45);
    letter-spacing:1px;
  }

  /* ---------- QUIZ SCREEN ---------- */
  .scoreboard-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
    font-size:13px;
    color:var(--gold-light);
  }

  .progress-track{
    flex:1;
    height:8px;
    background:rgba(239,231,214,0.12);
    border-radius:4px;
    margin:0 12px;
    overflow:hidden;
    border:1px solid var(--line);
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--gold), var(--red));
    border-radius:4px;
    transition:width .35s ease;
  }

  .question-card{
    background:rgba(239,231,214,0.06);
    border:1px solid var(--line);
    border-radius:16px;
    padding:26px 20px;
    backdrop-filter:blur(2px);
  }

  .q-eyebrow{
    font-size:11px;
    letter-spacing:3px;
    color:var(--gold-light);
    text-transform:uppercase;
    margin-bottom:10px;
  }

  .q-text{
    font-family:'Arial Black', Impact, 'Segoe UI', sans-serif;
    font-size:21px;
    line-height:1.3;
    margin-bottom:22px;
    text-transform:uppercase;
  }

  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .option-btn{
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    text-align:left;
    background:rgba(13,27,42,0.55);
    border:1px solid var(--line);
    color:var(--paper);
    padding:16px 18px;
    border-radius:10px;
    cursor:pointer;
    font-size:17.5px;
    line-height:1.4;
    transition:background .15s ease, border-color .15s ease, transform .1s ease;
  }
  .option-btn:hover{
    background:rgba(212,175,55,0.14);
    border-color:var(--gold);
  }
  .option-btn:active{
    transform:scale(0.98);
  }

  .opt-num{
    flex:0 0 auto;
    width:30px;
    height:30px;
    border-radius:50%;
    border:1px solid var(--gold);
    color:var(--gold-light);
    font-family:'Courier New', monospace;
    font-size:13px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* ============================================================
     RESULT SCREEN — TARJETA DE JUGADOR ESTILO VIDEOJUEGO (FUT-like)
  ============================================================ */
  .result-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .player-card{
    position:relative;
    width:100%;
    max-width:340px;
    background:
      linear-gradient(160deg, var(--card-bg-2) 0%, var(--card-bg) 55%, #0A0C0E 100%);
    border-radius:22px;
    padding:20px 18px 24px 18px;
    border:1px solid var(--card-edge);
    box-shadow:
      0 0 0 1px rgba(212,175,55,0.15),
      0 25px 50px rgba(0,0,0,0.55),
      inset 0 1px 0 rgba(255,255,255,0.04);
    overflow:hidden;
  }

  .player-card::before{
    content:"";
    position:absolute;
    top:-40%; right:-30%;
    width:70%; height:180%;
    background:linear-gradient(180deg, rgba(212,175,55,0.10), transparent 60%);
    transform:rotate(18deg);
    pointer-events:none;
  }

  .card-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    position:relative;
    z-index:2;
    margin-bottom:6px;
  }

  .card-rating-block{
    display:flex;
    flex-direction:column;
    align-items:center;
    line-height:1;
  }
  .card-rating{
    font-family:'Arial Black', Impact, sans-serif;
    font-size:38px;
    color:var(--gold-light);
    text-shadow:0 2px 6px rgba(0,0,0,0.5);
  }
  .card-position{
    font-family:'Arial Black', Impact, sans-serif;
    font-size:15px;
    letter-spacing:1px;
    color:var(--paper);
    margin-top:2px;
  }
  .card-position-full{
    font-size:10px;
    color:rgba(239,231,214,0.55);
    letter-spacing:0.5px;
    margin-top:1px;
    text-align:center;
    max-width:80px;
  }

  .card-nationality{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:4px;
  }
  .flag{
    font-size:26px;
    line-height:1;
  }
  .nation-name{
    font-size:10px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:rgba(239,231,214,0.6);
  }

  .card-photo-frame{
    position:relative;
    z-index:2;
    width:100%;
    height:190px;
    margin:6px 0 10px 0;
    border-radius:14px;
    background:
      radial-gradient(circle at 50% 30%, rgba(212,175,55,0.14), transparent 65%),
      linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.0));
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    border:1px solid rgba(255,255,255,0.05);
  }
  .card-photo{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }
  .img-fallback{
    display:none;
    width:100%;
    height:100%;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:0 16px;
    font-size:13px;
    color:rgba(239,231,214,0.5);
    background:repeating-linear-gradient(45deg, rgba(255,255,255,0.02) 0 10px, rgba(255,255,255,0.045) 10px 20px);
  }

  .card-name{
    position:relative;
    z-index:2;
    text-align:center;
    font-family:'Arial Black', Impact, 'Segoe UI', sans-serif;
    font-size:21px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    color:#fff;
    margin-bottom:2px;
  }

  .card-tagline{
    text-align:center;
    font-size:12px;
    font-style:italic;
    color:var(--gold-light);
    margin-bottom:14px;
  }

  .compat-ribbon{
    position:relative;
    z-index:2;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    background:linear-gradient(90deg, rgba(31,191,128,0.15), rgba(212,175,55,0.15));
    border:1px solid rgba(95,227,173,0.35);
    border-radius:10px;
    padding:9px 12px;
    margin-bottom:16px;
  }
  .compat-ribbon .num{
    font-family:'Courier New', monospace;
    font-weight:bold;
    font-size:20px;
    color:var(--emerald-light);
  }
  .compat-ribbon .txt{
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:rgba(239,231,214,0.8);
  }

  .stats-grid{
    position:relative;
    z-index:2;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px 16px;
    margin-bottom:16px;
  }
  .stat-row{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .stat-top{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    letter-spacing:1px;
    color:rgba(239,231,214,0.65);
    text-transform:uppercase;
  }
  .stat-top b{
    color:var(--gold-light);
    font-size:12px;
  }
  .stat-track{
    height:6px;
    border-radius:3px;
    background:rgba(255,255,255,0.08);
    overflow:hidden;
  }
  .stat-fill{
    height:100%;
    border-radius:3px;
    background:linear-gradient(90deg, var(--emerald), var(--gold-light));
  }

  .card-desc{
    position:relative;
    z-index:2;
    font-size:13px;
    line-height:1.55;
    color:rgba(239,231,214,0.85);
    background:rgba(255,255,255,0.04);
    border-left:3px solid var(--emerald);
    padding:10px 12px;
    border-radius:0 8px 8px 0;
  }

  .result-actions{
    margin-top:22px;
  }

  .center{ text-align:center; }

  @media (max-width:380px){
    h1.title{ font-size:30px; }
    .q-text{ font-size:18px; }
    .card-photo-frame{ height:160px; }
    .card-rating{ font-size:32px; }
  }
</style>
</head>
<body>

<div id="app"></div>

<script>

/* =========================================================
   PREGUNTAS (10) — posición, velocidad, técnica, fuerza,
   visión, definición, personalidad, pierna hábil, altura,
   estilo de juego

      { text:"Zurdo.", scores:{messi:3, vinicius:3, haaland:2} },
      { text:"Diestro.", scores:{cr7:3, mbappe:2, julian:2, rodri:2, vandijk:2, bellingham:2, dibu:2} },
      { text:"Ambidiestro, uso las dos por igual.", scores:{neymar:3, debruyne:2} }
    ]
  },
  {
    q:"¿Cómo es tu altura y presencia física?",
    options:[
      { text:"Bajito y ágil, se me hace difícil de marcar.", scores:{messi:3, julian:2} },
      { text:"Estatura media, un buen equilibrio general.", scores:{neymar:2, vinicius:2, mbappe:2, bellingham:1} },
      { text:"Alto, domino el juego aéreo.", scores:{haaland:3, vandijk:3, cr7:2} },
      { text:"La altura justa para reinar bajo los tres palos.", scores:{dibu:2, rodri:1, debruyne:1} }
    ]
  },
  {
    q:"¿Cómo definirías tu estilo de juego?",
    options:[
      { text:"Individualista, prefiero resolver solo la jugada.", scores:{messi:2, neymar:3, vinicius:2} },
      { text:"Colectivo, juego siempre pensando en el equipo.", scores:{debruyne:3, rodri:3} },
      { text:"Directo al gol, sin vueltas ni adornos.", scores:{haaland:3, cr7:2, julian:2} },
      { text:"Sacrificado, primero defiendo y después ataco.", scores:{vandijk:3, rodri:2, dibu:2} },
      { text:"Con personalidad, encaro y arriesgo todo el tiempo.", scores:{vinicius:2, mbappe:2, bellingham:2} }
    ]
  }
];

/* =========================================================
   ESTADO DEL JUEGO
========================================================= */
let currentQuestion = 0;
let scores = {};
const MAX_POINTS_PER_QUESTION = 3;
const MAX_TOTAL_POINTS = questions.length * MAX_POINTS_PER_QUESTION;

function initScores(){
  scores = {};
  Object.keys(players).forEach(key => { scores[key] = 0; });
}

/* =========================================================
   RENDER: PANTALLA INICIAL
========================================================= */
function renderStart(){
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="wrap start-screen">
      <span class="kicker scoreboard-font">10 PREGUNTAS · 1 RESULTADO</span>
      <div class="ball-line">⚽ 🥅 ⚽</div>
      <h1 class="title">¿Qué jugador <br> de <span class="accent">fútbol</span> sos?</h1>
      <p class="subtitle">Respondé sobre tu posición, velocidad, técnica y estilo de juego,
      y descubrí a qué crack del fútbol mundial te parecés.</p>
      <button class="btn" onclick="startQuiz()">Empezar ▶</button>
      <div class="start-footnote scoreboard-font">MESSI · CR7 · MBAPPÉ · HAALAND · NEYMAR · Y MÁS</div>
    </div>
  `;
}

function startQuiz(){
  initScores();
  currentQuestion = 0;
  renderQuestion();
}

/* =========================================================
   RENDER: PANTALLA DE PREGUNTA
========================================================= */
function renderQuestion(){
  const app = document.getElementById("app");
  const q = questions[currentQuestion];
  const progressPct = Math.round((currentQuestion / questions.length) * 100);

  const optionsHtml = q.options.map((opt, i) => `
    <button class="option-btn" onclick="selectAnswer(${i})">
      <span class="opt-num">${String(i + 1).padStart(2,"0")}</span>
      <span>${opt.text}</span>
    </button>
  `).join("");

  app.innerHTML = `
    <div class="wrap">
      <div class="scoreboard-bar scoreboard-font">
        <span>PREG. ${String(currentQuestion + 1).padStart(2,"0")}/${questions.length}</span>
        <div class="progress-track"><div class="progress-fill" style="width:${progressPct}%"></div></div>
        <span>${progressPct}%</span>
      </div>
      <div class="question-card">
        <div class="q-eyebrow">Pregunta ${currentQuestion + 1}</div>
        <div class="q-text">${q.q}</div>
        <div class="options">${optionsHtml}</div>
      </div>
    </div>
  `;
}

/* =========================================================
   LÓGICA: SELECCIONAR RESPUESTA
========================================================= */
function selectAnswer(optionIndex){
  const opt = questions[currentQuestion].options[optionIndex];
  Object.keys(opt.scores).forEach(playerKey => {
    scores[playerKey] += opt.scores[playerKey];
  });

  currentQuestion++;

  if (currentQuestion < questions.length){
    renderQuestion();
  } else {
    renderResult();
  }
}

/* =========================================================
   FUNCIÓN GLOBAL: manejar error de carga de imagen.
   Si la imagen no existe en la carpeta /images, se muestra
   un recuadro con el texto "Imagen no disponible" sin
   romper el resto de la página.
========================================================= */
function handleImgError(imgEl){
  imgEl.onerror = null;
  imgEl.style.display = "none";
  const fallback = imgEl.nextElementSibling;
  if (fallback){ fallback.style.display = "flex"; }
}

/* =========================================================
   RENDER: PANTALLA DE RESULTADO — TARJETA ESTILO VIDEOJUEGO
========================================================= */
function getWinner(){
  let bestKey = null;
  let bestScore = -1;
  Object.keys(scores).forEach(key => {
    if (scores[key] > bestScore){
      bestScore = scores[key];
      bestKey = key;
    }
  });
  return { key: bestKey, score: bestScore };
}

function statRow(label, value){
  return `
    <div class="stat-row">
      <div class="stat-top"><span>${label}</span><b>${value}</b></div>
      <div class="stat-track"><div class="stat-fill" style="width:${value}%"></div></div>
    </div>
  `;
}

function renderResult(){
  const app = document.getElementById("app");
  const { key, score } = getWinner();
  const p = players[key];

  const rawPct = score / MAX_TOTAL_POINTS;
  const compat = Math.min(99, Math.round(65 + rawPct * 34));

  const statsHtml = [
    statRow("Ritmo", p.pace),
    statRow("Tiro", p.shooting),
    statRow("Pase", p.passing),
    statRow("Regate", p.dribbling),
    statRow("Defensa", p.defending),
    statRow("Físico", p.physical)
  ].join("");

  app.innerHTML = `
    <div class="wrap result-wrap">
      <div class="player-card">

        <div class="card-header">
          <div class="card-rating-block">
            <div class="card-rating scoreboard-font">${p.rating}</div>
            <div class="card-position">${p.position}</div>
            <div class="card-position-full">${p.positionFull}</div>
          </div>
          <div class="card-nationality">
            <span class="flag">${p.flag}</span>
            <span class="nation-name">${p.nationality}</span>
          </div>
        </div>

        <div class="card-photo-frame">
          <img class="card-photo" src="${p.image}" alt="Foto de ${p.name}" onerror="handleImgError(this)">
          <div class="img-fallback">Imagen no disponible</div>
        </div>

        <div class="card-name">${p.name}</div>
        <div class="card-tagline">"${p.tag}"</div>

        <div class="compat-ribbon">
          <span class="num scoreboard-font">${compat}%</span>
          <span class="txt">Compatibilidad con vos</span>
        </div>

        <div class="stats-grid">
          ${statsHtml}
        </div>

        <p class="card-desc">${p.description}</p>

      </div>

      <div class="result-actions">
        <button class="btn" onclick="startQuiz()">🔁 Volver a jugar</button>
      </div>
    </div>
  `;
}

/* =========================================================
   INICIO
========================================================= */
window.onload = function(){
  initScores();
  renderStart();
};
</script>

</body>
</html>
